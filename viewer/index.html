<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS VM-Series HA — Multi-Region GlobalProtect Architecture Viewer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FA582D'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logos">
        <!-- Palo Alto Networks Icon -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="8" fill="#1E293B"/>
          <path d="M24 8C24 8 28.5 13.5 28.5 18C28.5 20.8 26.5 22.8 24 22.8C21.5 22.8 19.5 20.8 19.5 18C19.5 13.5 24 8 24 8Z" fill="#FA582D"/>
          <path d="M24 24C16.8 24 11 29.8 11 37C11 38.5 11.3 40 11.7 41.2C13.8 38.2 17.5 36.2 21.8 36.2C24.4 36.2 26.7 37 28.5 38.4C27.5 35.8 27 33 27 30C27 27.5 27.8 25.2 29.2 23.3C27.6 23.7 25.8 24 24 24Z" fill="#FA582D"/>
          <path d="M37 37C37 29.8 31.2 24 24 24C23.2 24 22.4 24.1 21.7 24.2C23.1 26.1 24 28.5 24 31C24 34.2 22.8 37.1 20.8 39.3C21.8 39.8 22.9 40 24 40C31.2 40 37 34.2 37 37Z" fill="#FF8364"/>
        </svg>
        <!-- AWS Icon -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="8" fill="#232F3E"/>
          <path d="M14 28C14 24.7 16.7 22 20 22C20.5 22 21 22.1 21.5 22.2C22.6 19.2 25.5 17 29 17C33.4 17 37 20.6 37 25C37 25.3 37 25.7 36.9 26C38.7 26.9 40 28.8 40 31C40 34.3 37.3 37 34 37H16C12.7 37 10 34.3 10 31C10 29.6 10.5 28.3 11.3 27.3C11.1 26.6 11 25.8 11 25C11 21.7 13.7 19 17 19" stroke="#FF9900" stroke-width="2"/>
        </svg>
      </div>
      <div class="brand-divider"></div>
      <div class="project-titles">
        <h1>AWS VM-Series HA + Multi-Region GP <span class="badge-ver">PAN-OS 11.1</span></h1>
        <p>Interactive Architecture Viewer &amp; Resilience Simulator</p>
      </div>
    </div>

    <!-- Mode Switcher Tabs -->
    <div class="header-center">
      <button class="mode-tab active" data-mode="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <span>Overview</span>
      </button>
      <button class="mode-tab" data-mode="flows">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Traffic Flows</span>
      </button>
      <button class="mode-tab" data-mode="scenarios">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Failure Simulator</span>
      </button>
      <button class="mode-tab" data-mode="presentation">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Client Presentation</span>
      </button>
    </div>

    <!-- Header Actions -->
    <div class="header-right">
      <!-- English-only deployment: the PL toggle is intentionally omitted.
           The bilingual source still ships both data sets; only the English
           entry point is published here. -->

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search (e.g. HA2, TGW, EIP, IP)...">
      </div>
      <button class="btn-icon" id="btn-fullscreen" title="Full Screen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <a href="https://github.com/mzalewski87/aws_ha_project" target="_blank" class="btn-repo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="app-container">

    <!-- Quick Level Navigation Presets -->
    <div class="quick-nav-bar">
      <span class="nav-label">LEVEL:</span>
      <button class="nav-btn active" data-view="overview" onclick="window.app.setViewPreset('overview')">🌐 Overview</button>
      <button class="nav-btn" data-view="ha-cluster" onclick="window.app.setViewPreset('ha-cluster')">🛡️ HA Cluster (Security)</button>
      <button class="nav-btn" data-view="region-a" onclick="window.app.setViewPreset('region-a')">⚡ Region A (Frankfurt)</button>
      <button class="nav-btn" data-view="region-b" onclick="window.app.setViewPreset('region-b')">🔄 Region B (Dublin DR)</button>
      <button class="nav-btn" data-view="mgmt" onclick="window.app.setViewPreset('mgmt')">🔐 Panorama &amp; SSM</button>
    </div>

    <!-- Zoom & Canvas Controls -->
    <div class="viewport-controls">
      <button class="btn-icon" id="btn-zoom-in" title="Zoom In">+</button>
      <button class="btn-icon" id="btn-zoom-out" title="Zoom Out">-</button>
      <button class="btn-icon" id="btn-zoom-reset" title="Reset View">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
    </div>

    <!-- Interactive Left Panel -->
    <aside class="left-panel" id="left-panel">
      <div class="panel-header">
        <h2 id="panel-title">Navigation</h2>
      </div>
      <div class="panel-content" id="panel-dynamic-content">
        <!-- Injected dynamically based on mode -->
      </div>
    </aside>

    <!-- Interactive Architecture Diagram Canvas (SVG) -->
    <div class="diagram-viewport" id="diagram-viewport">
      <svg id="architecture-svg"></svg>
    </div>

    <!-- Right Drawer (Component Technical Spec) -->
    <aside class="right-drawer" id="component-drawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <div class="drawer-icon" id="drawer-icon-holder"></div>
          <div>
            <h3 id="drawer-title">Component Specifications</h3>
            <span id="drawer-cat">Category</span>
          </div>
        </div>
        <button class="btn-icon" id="btn-close-drawer" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-body">
        <div class="drawer-summary" id="drawer-summary">
          Component summary...
        </div>
        <table class="spec-table">
          <tbody id="drawer-specs-table">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </aside>

    <!-- Presentation Walkthrough Bottom Bar -->
    <div class="presentation-bar hidden" id="presentation-bar">
      <div class="presentation-header">
        <div class="slide-counter" id="pres-slide-counter">SLIDE 1 OF 10</div>
        <div class="presentation-title" id="pres-slide-title">Presentation Title</div>
      </div>
      <div class="presentation-content" id="pres-slide-content">
        Slide content...
      </div>
      <div class="presentation-actions">
        <button class="btn-playback" onclick="window.app.prevSlide()">⬅ Previous Slide</button>
        <button class="btn-playback primary" onclick="window.app.nextSlide()">Next Slide ➔</button>
      </div>
    </div>

  </main>

  <!-- JavaScript Modules -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data_en.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
